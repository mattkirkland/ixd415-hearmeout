<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hear Me Out poster: Cover Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..900&family=DM+Serif+Display:ital@1&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!--
    Maya's poster: checkout-aisle tabloid cover. The next talk is the cover
    story, everyone else is a cover line down the side.

    Everything about the talks comes from ../../data.js via ../poster.js.
    The hardcoded bits are tabloid furniture: "EXCLUSIVE", the price, the
    barcode, the little tags on each cover line.
  -->

  <main class="poster">

    <div class="topline">
      <span data-series="course"></span>
      <span class="issue">Vol. 1 &middot; <span data-series="term"></span></span>
    </div>

    <header class="masthead">
      <h1 data-series="title"></h1>
      <p class="subtitle" data-series="subtitle"></p>
    </header>

    <section class="cover-story">
      <p class="exclusive">Exclusive!</p>
      <p class="tells">This week</p>
      <h2 class="speaker" data-next="speaker"></h2>
      <p class="tells">tells all:</p>
      <p class="headline"><span class="quote" data-next="title"></span></p>
    </section>

    <div class="burst">
      <span class="burst-label">Live!</span>
      <span class="burst-month" data-next="month"></span>
      <span class="burst-day" data-next="day"></span>
    </div>

    <aside class="lines">
      <p class="lines-head">Also inside</p>
      <ol data-talks>
        <template>
          <li>
            <span class="tag"></span>
            <span class="who" data-field="speaker"></span>
            <span class="what" data-field="title"></span>
            <span class="when" data-field="date"></span>
          </li>
        </template>
      </ol>
    </aside>

    <section class="plus">
      <p class="plus-tag">Plus!</p>
      <p class="blurb" data-series="blurb"></p>
    </section>

    <footer class="strip">
      <p class="where"><span data-series="when"></span><br><span data-series="where"></span></p>
      <p class="free">Free</p>
      <div class="barcode" aria-hidden="true">
        <div class="bars"></div>
        <span>0 41500 26415 9</span>
      </div>
    </footer>

  </main>

  <script src="../../data.js"></script>
  <script src="../poster.js"></script>
  <script>
    // Titles that aren't in yet read "TBD" in the data. Give them a tabloid line instead.
    document.querySelectorAll('[data-field="title"], [data-next="title"]').forEach(function (el) {
      if (el.textContent.trim() === 'TBD') {
        el.textContent = 'Title under wraps';
        el.classList.add('tbd');
      }
    });

    // Long names (LEANDRA) shrink until they fit the cover story column.
    // Waits for Anton to load, since the fallback font measures differently.
    document.fonts.ready.then(function () {
      var name = document.querySelector('.cover-story .speaker');
      var size = 200;
      name.style.fontSize = size + 'px';
      while (name.scrollWidth > name.clientWidth && size > 90) {
        size -= 4;
        name.style.fontSize = size + 'px';
      }
    });

    // Scale the fixed 800x1100 cover down to fit smaller windows (like the viewer).
    (function () {
      var poster = document.querySelector('.poster');
      function fit() {
        var s = Math.min(1, window.innerWidth / 800, window.innerHeight / 1100);
        poster.style.setProperty('--scale', s);
      }
      window.addEventListener('resize', fit);
      fit();
    })();
  </script>
</body>
</html>
