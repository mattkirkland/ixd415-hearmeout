<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hear Me Out poster: Hang In There</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!--
    Hang In There, by Loudon.

    Nine letters, nine color tiles. tiles.js builds the tiles from
    HEAR_ME_OUT.series.title and hangs cats off the letters they fit: over the
    H's crossbar, inside the O, from the arm of the T, and one off the bottom
    of the grid. Everything else is filled in by poster.js from ../../data.js.
  -->

  <main class="poster">
    <h1 class="visually-hidden" data-series="title"></h1>
    <div class="tiles" aria-hidden="true"></div>

    <div class="band">

      <section class="next-up" aria-labelledby="next-up-label">
        <h2 class="label" id="next-up-label">Next up</h2>
        <p class="who" data-next="speaker"></p>
        <p class="when" data-next="date" data-format="long"></p>
        <p class="what" data-next="title"></p>
        <p class="meta">
          <span data-series="course"></span><br>
          <span data-series="when"></span> · <span data-series="where"></span><br>
          <span data-series="term"></span>
        </p>
      </section>

      <section class="lineup" aria-labelledby="lineup-label">
        <h2 class="visually-hidden" id="lineup-label">The lineup</h2>
        <ol data-talks>
          <template>
            <li>
              <span class="date" data-field="date"></span>
              <span class="speaker" data-field="speaker"></span>
              <span class="title" data-field="title"></span>
            </li>
          </template>
        </ol>
      </section>

    </div>
  </main>

  <script src="../../data.js"></script>
  <script src="tiles.js"></script>
  <script src="../poster.js"></script>
</body>
</html>
