<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Posters - Hear Me Out</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Viewer-only styles. Each poster has its own CSS inside the frame. */
    body { margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
    .viewer-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 8px 16px; border-bottom: 1px solid #000;
      font-family: sans-serif; font-size: 14px;
    }
    .viewer-bar .spacer { flex: 1; }
    .viewer-bar button {
      font: inherit; padding: 4px 10px; background: #fff; border: 1px solid #000; cursor: pointer;
    }
    .viewer-bar button:disabled { opacity: 0.3; cursor: default; }
    .viewer-bar select { font: inherit; }
    #frame { flex: 1; width: 100%; border: 0; background: #fff; }
    @media (prefers-color-scheme: dark) {
      .viewer-bar { border-color: #888; }
      .viewer-bar button { background: #222; color: #eee; border-color: #888; }
    }
  </style>
</head>
<body>

  <div class="viewer-bar">
    <a href="index.html">&larr; Schedule</a>
    <span class="spacer"></span>
    <button id="prev" type="button">&larr; Prev</button>
    <select id="pick" aria-label="Choose a poster"></select>
    <button id="next" type="button">Next &rarr;</button>
    <span id="count"></span>
    <span class="spacer"></span>
    <a id="open" href="#" target="_blank">Open full size</a>
  </div>

  <iframe id="frame" title="Poster"></iframe>

  <script src="posters/manifest.js"></script>
  <script>
    (function () {
      var posters = window.POSTERS || [];
      var frame = document.getElementById('frame');
      var pick = document.getElementById('pick');
      var prev = document.getElementById('prev');
      var next = document.getElementById('next');
      var count = document.getElementById('count');
      var open = document.getElementById('open');

      if (!posters.length) {
        document.querySelector('.viewer-bar').insertAdjacentHTML('beforeend', '<span>No posters yet.</span>');
        return;
      }

      posters.forEach(function (p, i) {
        var opt = document.createElement('option');
        opt.value = i;
        opt.textContent = p.title + ' (' + p.author + ')';
        pick.appendChild(opt);
      });

      // Which poster to start on: ?p=<slug> in the URL, else the first.
      var slug = new URLSearchParams(location.search).get('p');
      var index = Math.max(0, posters.findIndex(function (p) { return p.slug === slug; }));

      function show(i) {
        index = (i + posters.length) % posters.length;
        var p = posters[index];
        var src = 'posters/' + p.slug + '/index.html';
        frame.src = src;
        open.href = src;
        pick.value = index;
        count.textContent = (index + 1) + ' of ' + posters.length;
        document.title = p.title + ' - Hear Me Out posters';
        history.replaceState(null, '', '?p=' + encodeURIComponent(p.slug));
      }

      prev.addEventListener('click', function () { show(index - 1); });
      next.addEventListener('click', function () { show(index + 1); });
      pick.addEventListener('change', function () { show(Number(pick.value)); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') show(index - 1);
        if (e.key === 'ArrowRight') show(index + 1);
      });

      show(index);
    })();
  </script>
</body>
</html>
